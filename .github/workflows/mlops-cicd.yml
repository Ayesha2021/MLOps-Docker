# Automating CICD for running Falsk App in Constainer
name: CICD For Containerized Falsk App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

# Building docker image instead of using github buildx action 
job:
    dockerbuild:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: Build the Docker image
          run: docker build . --file DockerFile --tag FastAPI-ImageBuild-WorkFlow:$(date+%s)



    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask
          pip install pytest

      - name: Run tests
        run: |
          pytest

  build-and-publish:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}

      - name: Build and push Docker Image
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./DockerFile
          push: true
          tags: ${{secrets.DOCKER_USERNAME}}/flaskcontainer-app:latest

      - name: Image Digest
        run: echo "${{ steps.build-and-push.outputs.digest }}"
